[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pmvotes"
version = "1.0.0"
description = "Polymarket–UMA Adjudication Data: cross-chain linkage, ballot acquisition, release build."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "pycryptodome>=3.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
