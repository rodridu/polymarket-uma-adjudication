# UMA DVM voting contracts on Ethereum mainnet.
# The pipeline must fail-closed: only contracts with supported: true are indexed.
#
# VotingV1 handled pre-round-9715 disputes (before 2023-03-14). Those 3 cases
# are labelled PRE_VOTING_V2 and excluded from ballot/round indexing.

voting_contracts:
  VotingV1:
    address: null  # not recorded in this codebase; pipeline does not index it
    chain: ethereum
    chain_id: 1
    active_from: "2020"
    superseded_by: VotingV2
    version: "VotingV1"
    supported: false
    note: "3 Polymarket disputes fell under VotingV1 (PRE_VOTING_V2, before round 9715)"

  VotingV2:
    address: "0x004395edb43EFca9885CEdad51EC9fAf93Bd34ac"
    chain: ethereum
    chain_id: 1
    active_from: "2023-03-14"  # round 9715
    round_seconds: 172800      # 24h commit + 24h reveal
    version: "VotingV2"
    supported: true
